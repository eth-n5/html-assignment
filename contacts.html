<div class="box">
<h2>Contact Page</h2>
<hr>

<form>

<h4>Personal Information</h4>
First name<br><input type="text" required><br>
Surname<br><input type="text" required><br>
Email address<br><input type="email" required><br>
Student number<br><input type="text"><br>


<h4>Enquiry Type</h4>
<select>
<option>General enquiry</option>
<option>Programme information</option>
<option>Registration</option>
<option>Technical support</option>
<option>Other</option>
</select>

<h4>Message</h4>
<textarea rows="4"></textarea>


<h4>Preferred Contact Method</h4>
<input type="radio" name="contact" class="contact-method"> Email<br>
<input type="radio" name="contact" class="contact-method"> Phone<br>
<input type="radio" name="contact" class="contact-method"> SMS<br><br>
<input type="submit" value="Submit" class="form-button">
<input type="reset" value="Reset" class="form-button">
</form>

<p class="contact-footer">&copy; 2026 CS Dept, UL</p>
