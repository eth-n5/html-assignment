<div class="box">
<h2>Contact Page</h2>
<hr>

<form>

<h4>Personal Information</h4>
First name<br><input type="text" required><br>
Surname<br><input type="text" required><br>
Email address<br><input type="email" required><br>
Student number<br><input type="text"><br>


<h4>Enquiry Type</h4>
<select>
<option>General enquiry</option>
<option>Programme information</option>
<option>Registration</option>
<option>Technical support</option>
<option>Other</option>
</select>

<h4>Message</h4>
<textarea rows="4"></textarea>


<h4>Preferred Contact Method</h4>
<input type="radio" name="contact" style="width:auto;"> Email<br>
<input type="radio" name="contact" style="width:auto;"> Phone<br>
<input type="radio" name="contact" style="width:auto;"> SMS<br><br>
<input type="submit" value="Submit" style="width:100px;">
<input type="reset" value="Reset" style="width:100px;">
</form>
