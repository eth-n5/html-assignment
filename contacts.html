<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact the University of Limpopo Computer Science Department.">
<title>Contact | University of Limpopo Computer Science</title>
<style>
	:root { --forest: #164b3f; --forest-dark: #10372f; --gold: #e5b94d; --ink: #202a27; --muted: #5c6964; --line: #d9e1dc; }
	* { box-sizing: border-box; }
	body { min-height: 100vh; margin: 0; color: var(--ink); background: linear-gradient(rgba(15, 43, 35, .68), rgba(15, 43, 35, .68)), url("background.jpg") center / cover fixed; font: 16px/1.65 "Trebuchet MS", "Segoe UI", sans-serif; }
	.site-nav { background: var(--forest-dark); border-bottom: 3px solid var(--gold); }
	.site-nav__inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; max-width: 1120px; min-height: 68px; margin: auto; padding: 10px 24px; }
	.site-name { color: #fff; font: bold 17px/1.25 Georgia, "Times New Roman", serif; }
	.site-links { display: flex; flex-wrap: wrap; gap: 6px; }
	.site-links a { padding: 8px 12px; border-radius: 3px; color: #fff; font-size: 14px; text-decoration: none; }
	.site-links a:hover, .site-links a:focus-visible, .site-links a[aria-current="page"] { color: var(--forest-dark); background: var(--gold); }
	.box { width: calc(100% - 40px); max-width: 860px; margin: 36px auto; padding: 36px; border-top: 5px solid var(--gold); background: #fff; box-shadow: 0 14px 40px rgba(9, 28, 23, .22); }
	h1, h2, h3, h4 { color: var(--forest-dark); font-family: Georgia, "Times New Roman", serif; line-height: 1.25; }
	h1 { margin: 0 0 12px; font-size: 40px; }
	h2 { margin: 28px 0 10px; font-size: 27px; }
	h3 { margin: 26px 0 6px; font-size: 20px; }
	h4 { margin: 22px 0 8px; font-size: 17px; }
	p { margin: 0 0 16px; }
	a { color: #17634f; }
	a:hover { color: #0e3c31; }
	hr { height: 1px; margin: 28px 0; border: 0; background: var(--line); }
	.contact-form label { display: block; margin: 12px 0 4px; font-weight: 700; }
	.contact-form input:not([type="radio"]), .contact-form select, .contact-form textarea { width: 100%; padding: 10px 12px; border: 1px solid #aebbb4; border-radius: 3px; background: #fff; color: var(--ink); font: inherit; }
	.contact-form input:focus, .contact-form select:focus, .contact-form textarea:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
	.contact-form fieldset { margin: 20px 0; padding: 12px 16px; border: 1px solid var(--line); }
	.contact-form legend { padding: 0 6px; color: var(--forest-dark); font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
	.radio-option { display: inline-flex !important; align-items: center; gap: 7px; margin: 4px 18px 4px 0 !important; font-weight: 400 !important; }
	.radio-option input { accent-color: var(--forest); }
	.form-actions { display: flex; gap: 10px; margin-top: 18px; }
	.form-actions input { width: auto !important; padding: 9px 18px !important; border: 1px solid var(--forest) !important; cursor: pointer; font-weight: 700 !important; }
	.form-actions input[type="submit"] { color: #fff; background: var(--forest); }
	.form-actions input[type="reset"] { color: var(--forest); background: #fff; }
	.site-footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; text-align: center; }
	.site-footer p { margin: 3px 0; }
	@media (max-width: 640px) {
		.site-nav__inner { align-items: flex-start; flex-direction: column; gap: 8px; padding: 14px 20px; }
		.site-links { width: 100%; gap: 2px; }
		.site-links a { padding: 7px 9px; }
		.box { width: calc(100% - 24px); margin: 18px auto; padding: 22px 18px; }
		h1 { font-size: 32px; }
		body { background-attachment: scroll; }
	}
</style>
</head>
<body>
<nav class="site-nav" aria-label="Main navigation">
<div class="site-nav__inner">
<span class="site-name">University of Limpopo<br>Computer Science</span>
<div class="site-links">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="modules.html">Modules</a>
<a href="contacts.html" aria-current="page">Contact</a>
</div>
</div>
</nav>
<main class="box">
<h1>Contact the Department</h1>
<p class="university-name">Computer Science, University of Limpopo</p>

<form class="contact-form">
<h3>Personal Information</h3>
<label for="first-name">First name</label>
<input id="first-name" name="first-name" type="text" autocomplete="given-name" required>
<label for="surname">Surname</label>
<input id="surname" name="surname" type="text" autocomplete="family-name" required>
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<label for="student-number">Student number</label>
<input id="student-number" name="student-number" type="text">

<label for="enquiry-type">Enquiry type</label>
<select id="enquiry-type" name="enquiry-type">
<option>General enquiry</option>
<option>Programme information</option>
<option>Registration</option>
<option>Technical support</option>
<option>Other</option>
</select>

<label for="message">Message</label>
<textarea id="message" name="message" rows="5"></textarea>

<fieldset>
<legend>Preferred contact method</legend>
<label class="radio-option"><input type="radio" name="contact" value="email"> Email</label>
<label class="radio-option"><input type="radio" name="contact" value="phone"> Phone</label>
<label class="radio-option"><input type="radio" name="contact" value="sms"> SMS</label>
</fieldset>

<div class="form-actions">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</div>
</form>

<footer class="site-footer">
<p>&copy; 2026 Dept. of Computer Science, University of Limpopo</p>
<p>Turfloop Campus, Mankweng | compsci@ul.ac.za | 015 268 1234</p>
</footer>
</main>
</body>
</html>
